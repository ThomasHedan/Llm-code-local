[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lclai"
version = "0.1.0"
description = "100% local AI code assistant for restricted environments"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
    "httpx>=0.27",
    "click>=8.1",
    "pydantic>=2.0",
    "tiktoken>=0.7",
]

[project.scripts]
lclai = "lclai.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
